[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jwt-audit-sentinel"
version = "0.1.0"
description = "Fast zero-dependency CLI & library for inspecting, decoding, verifying cryptographic signatures, detecting algorithm confusion vulnerabilities, checking claims/expirations, and generating formatted audit reports."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "jwt",
    "security",
    "audit",
    "token",
    "hmac",
    "rsa",
    "algorithm-confusion",
    "auth",
    "cli",
    "linter"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
crypto = [
    "cryptography>=3.4.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "cryptography>=3.4.0",
]

[project.scripts]
jwt-audit-sentinel = "jwt_audit_sentinel.cli:main"
jwt-audit = "jwt_audit_sentinel.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
